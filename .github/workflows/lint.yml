name: lint
on:
  pull_request:
  push:
    branches: [next]

jobs:
  tsc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - name: Install dependencies
        run: npm ci
      - name: tsc
        run: npm run tsc
