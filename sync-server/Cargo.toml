[package]
name = "local-sync-server"
version = "0.0.1"
edition = "2021"
authors = ["Jacob Bolda <me@jacobbolda.com>"]
description = "A lightweight WebSocket server used to sync your data locally"

[dependencies]
futures = "0.3"
futures-util = "0.3"
base64 = "0.21"
sha1 = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
loro = "1.10"
loro-protocol = "0.1"
loro-websocket-server = "0.1"
tokio-tungstenite = "0.27"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "net",
    "sync",
    "time",
    "process",
] }
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
url = "2"
futures-util = "0.3"
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serial_test = "0.5"
once_cell = "1.20"
